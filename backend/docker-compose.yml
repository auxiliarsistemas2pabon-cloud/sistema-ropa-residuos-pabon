services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinica_pabon}
      POSTGRES_USER: ${POSTGRES_USER:-clinica_pabon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica_pabon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica_pabon}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
